<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Stat Calculator</title>

  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stat Calc">
  <link id="apple-touch-icon" rel="apple-touch-icon">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      padding-top: env(safe-area-inset-top, 20px);
      padding-bottom: env(safe-area-inset-bottom, 20px);
      padding-left: env(safe-area-inset-left, 16px);
      padding-right: env(safe-area-inset-right, 16px);
      background-color: #121212;
    }
    select option { color: #000; }
  </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center">

  <div class="w-full max-w-2xl px-4 py-6 flex flex-col gap-6">

    <header class="flex flex-col sm:flex-row items-center justify-between gap-4 border-b border-neutral-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-white">Stat Calculator</h1>
        <p id="save-status" class="text-xs text-neutral-400 mt-1">Status: Initialized</p>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="revertToSaved()" class="px-3 py-2 text-xs font-semibold rounded-lg bg-neutral-800 text-neutral-300 hover:bg-neutral-700 transition">Revert</button>
        <button id="save-btn" onclick="saveInputs()" class="px-5 py-2 text-sm font-bold rounded-lg bg-emerald-600 text-white hover:bg-emerald-500 active:scale-95 transition shadow-lg shadow-emerald-950">Save Inputs</button>
      </div>
    </header>

    <div id="cards" class="flex flex-col gap-6"></div>
  </div>

  <script>
    const STORAGE_KEY = "pwa_stat_calculator_v3";

    // Unit multipliers for the unit dropdown next to each big-number input
    const UNITS = [["1", "ones"], ["1e3", "K"], ["1e6", "M"], ["1e9", "B"], ["1e12", "T"]];

    // u: true = number input with a unit dropdown. btn = shortcut button above the input.
    const CARDS = [
      { id: "eatk", title: "EAtk", color: "emerald",
        fields: [
          { id: "eatk_x", label: "Atk", u: true, ph: "e.g. 1000" },
          { id: "eatk_y", label: "Def %", ph: "e.g. 25" }
        ],
        results: [{ id: "eatk_result", label: "Calculated EAtk:" }] },

      { id: "def", title: "Def", color: "blue",
        fields: [
          { id: "def_x", label: "Def Abs.", u: true, ph: "e.g. 500" },
          { id: "def_y", label: "Def %", ph: "e.g. 30" }
        ],
        results: [{ id: "def_result", label: "Calculated Def:" }] },

      { id: "tdef", title: "TDef", color: "purple",
        fields: [
          { id: "tdef_x", label: "Value", u: true, ph: "e.g. 1500" },
          { id: "tdef_eatk", label: "EAtk", u: true, ph: "e.g. 714.28",
            btn: { text: "Use EAtk from above", fn: "copyEAtk('tdef_eatk')" } }
        ],
        results: [{ id: "tdef_result", label: "Calculated TDef (Rounded Down):", big: true }],
        raw: "tdef_raw" },

      { id: "dps", title: "DPS (Projectiles)", color: "amber",
        fields: [
          { id: "dps_dmg", label: "Damage", u: true, ph: "e.g. 792.9",
            btn: { text: "Use EAtk from above", fn: "copyEAtk('dps_dmg')" } },
          { id: "dps_spd", label: "Attack Speed (shots/s)", ph: "e.g. 2.5" },
          { id: "dps_cc", label: "Crit Chance %", ph: "e.g. 40" },
          { id: "dps_cf", label: "Crit Factor (x)", ph: "e.g. 3.5" }
        ],
        results: [
          { id: "dps_avg", label: "Avg damage per shot:" },
          { id: "dps_result", label: "DPS:", big: true }
        ] }
    ];

    const COLORS = {
      emerald: ["text-emerald-400", "focus:border-emerald-500"],
      blue:    ["text-blue-400",    "focus:border-blue-500"],
      purple:  ["text-purple-400",  "focus:border-purple-500"],
      amber:   ["text-amber-400",   "focus:border-amber-500"]
    };
    const RESULT_COLOR = {};

    const fieldIds = [];
    const unitIds = [];
    CARDS.forEach(c => c.fields.forEach(f => { fieldIds.push(f.id); if (f.u) unitIds.push(f.id + "_u"); }));

    function renderCards() {
      document.getElementById("cards").innerHTML = CARDS.map(c => {
        const [txt, focus] = COLORS[c.color];
        const fields = c.fields.map(f => `
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="text-sm font-semibold text-white" for="${f.id}">${f.label}</label>
              ${f.btn ? `<button type="button" onclick="${f.btn.fn}" class="text-xs ${txt} underline">${f.btn.text}</button>` : ""}
            </div>
            <div class="flex gap-2">
              <input type="number" inputmode="decimal" step="any" id="${f.id}" oninput="handleInputChange()" placeholder="${f.ph}"
                class="min-w-0 flex-1 bg-white text-black font-semibold px-3 py-2.5 rounded-lg border-2 border-neutral-300 focus:outline-none ${focus}">
              ${f.u ? `<select id="${f.id}_u" onchange="handleInputChange()" class="bg-neutral-800 text-white font-semibold px-2 rounded-lg border-2 border-neutral-700 focus:outline-none ${focus}">
                ${UNITS.map(([v, l]) => `<option value="${v}">${l}</option>`).join("")}</select>` : ""}
            </div>
          </div>`).join("");
        const results = c.results.map(r => {
          RESULT_COLOR[r.id] = txt;
          return `<div class="flex items-baseline justify-between">
            <span class="text-sm font-medium text-neutral-400">${r.label}</span>
            <span id="${r.id}" class="${r.big ? "text-3xl font-black" : "text-2xl font-bold"} font-mono ${txt}">—</span></div>`;
        }).join("");
        return `<section class="bg-neutral-900 border border-neutral-800 rounded-2xl p-5 shadow-md">
          <h2 class="text-lg font-bold text-white mb-4">${c.title}</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">${fields}</div>
          <div class="mt-4 pt-3 border-t border-neutral-800 flex flex-col gap-2">${results}
            ${c.raw ? `<div id="${c.raw}" class="text-xs font-mono text-neutral-500 text-right">Raw: —</div>` : ""}
          </div></section>`;
      }).join("");
    }

    // ---------- helpers ----------
    const num = id => parseFloat(document.getElementById(id).value);
    // Big-number value = typed number x selected unit
    const big = id => num(id) * parseFloat(document.getElementById(id + "_u").value);

    function defaults() {
      const d = {};
      fieldIds.forEach(id => d[id] = "");
      unitIds.forEach(id => d[id] = "1");
      return d;
    }

    function show(id, text, state) {
      const el = document.getElementById(id);
      const isBig = el.className.includes("text-3xl");
      el.textContent = text;
      const size = isBig ? "text-3xl font-black" : "text-2xl font-bold";
      if (state === "err") el.className = "text-lg font-bold font-mono text-rose-400";
      else if (state === "empty") el.className = `${size} font-mono text-neutral-600`;
      else el.className = `${size} font-mono ${RESULT_COLOR[id]}`;
    }

    function trim(n) {
      return n.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 3 });
    }

    // Compact format like the game: 792.9K, 1.234M ...
    function fmt(n) {
      if (!isFinite(n)) return "—";
      const a = Math.abs(n);
      for (const [v, l] of [[1e12, "T"], [1e9, "B"], [1e6, "M"], [1e3, "K"]]) {
        if (a >= v) return trim(n / v) + l;
      }
      return trim(n);
    }

    // Put a number into a big-number input, picking the best unit
    function setWithUnit(id, n) {
      let mult = 1;
      for (const [v] of UNITS) if (Math.abs(n) >= parseFloat(v)) mult = parseFloat(v);
      document.getElementById(id).value = parseFloat((n / mult).toFixed(4));
      document.getElementById(id + "_u").value = String(UNITS.find(([v]) => parseFloat(v) === mult)[0]);
    }

    // ---------- calculations ----------
    function calculateAll() {
      // EAtk = Atk * (100 - Def%) / 100
      const ea = big("eatk_x"), ey = num("eatk_y");
      if (isNaN(ea) || isNaN(ey)) { show("eatk_result", "—", "empty"); }
      else if (ey > 100) { show("eatk_result", "Def % must be ≤ 100", "err"); lastEAtk = null; }
      else { lastEAtk = ea * (100 - ey) / 100; show("eatk_result", fmt(lastEAtk)); }
      if (isNaN(ea) || isNaN(ey) || ey > 100) lastEAtk = null;

      // Def = Def Abs / ((100 - Def%) / 100)
      const dx = big("def_x"), dy = num("def_y");
      if (isNaN(dx) || isNaN(dy)) show("def_result", "—", "empty");
      else if (dy >= 100) show("def_result", "Def % must be < 100", "err");
      else show("def_result", fmt(dx / ((100 - dy) / 100)));

      // TDef = floor(Value / EAtk)
      const tx = big("tdef_x"), te = big("tdef_eatk");
      const raw = document.getElementById("tdef_raw");
      if (isNaN(tx) || isNaN(te)) { show("tdef_result", "—", "empty"); raw.textContent = "Raw: —"; }
      else if (te === 0) { show("tdef_result", "Cannot div by 0", "err"); raw.textContent = "Raw: —"; }
      else {
        const r = tx / te;
        // toPrecision guards against float noise (e.g. 0.3/0.1 = 2.9999999999999996)
        show("tdef_result", Math.floor(Number(r.toPrecision(12))).toLocaleString());
        raw.textContent = "Raw: " + trim(r);
      }

      // DPS = Damage * Attack Speed * (1 + CritChance * (CritFactor - 1))
      const dmg = big("dps_dmg"), spd = num("dps_spd"), cc = num("dps_cc"), cf = num("dps_cf");
      if ([dmg, spd, cc, cf].some(isNaN)) { show("dps_avg", "—", "empty"); show("dps_result", "—", "empty"); }
      else if (cc < 0 || cc > 100) { show("dps_avg", "—", "empty"); show("dps_result", "Crit % must be 0–100", "err"); }
      else {
        const avg = dmg * (1 + (cc / 100) * (cf - 1));
        show("dps_avg", fmt(avg));
        show("dps_result", fmt(avg * spd));
      }
    }

    let lastEAtk = null;

    function copyEAtk(targetId) {
      if (lastEAtk === null || isNaN(lastEAtk)) return;
      setWithUnit(targetId, lastEAtk);
      handleInputChange();
    }

    function handleInputChange() { calculateAll(); updateSaveStatus(); }

    // ---------- saving ----------
    function getInputs() {
      const data = {};
      [...fieldIds, ...unitIds].forEach(id => data[id] = document.getElementById(id).value);
      return data;
    }

    function setInputs(data) {
      [...fieldIds, ...unitIds].forEach(id => {
        if (data[id] !== undefined) document.getElementById(id).value = data[id];
      });
    }

    function readSaved() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? { ...defaults(), ...JSON.parse(raw) } : defaults();
      } catch (e) { return defaults(); }
    }

    function saveInputs() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(getInputs())); }
      catch (e) { console.error("Could not save", e); }
      updateSaveStatus();
      const btn = document.getElementById("save-btn");
      btn.textContent = "Saved ✓";
      setTimeout(() => { btn.textContent = "Save Inputs"; }, 1200);
    }

    function revertToSaved() {
      setInputs(readSaved());
      calculateAll();
      updateSaveStatus();
    }

    function updateSaveStatus() {
      const same = JSON.stringify(getInputs()) === JSON.stringify(readSaved());
      const el = document.getElementById("save-status");
      el.textContent = same ? "All changes saved" : "Unsaved changes (tap 'Save Inputs' to persist)";
      el.className = "text-xs mt-1 " + (same ? "text-emerald-400" : "text-amber-400");
    }

    // ---------- iPad home screen icon ----------
    function createAppIcon() {
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = 180;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#121212";
      ctx.fillRect(0, 0, 180, 180);
      ctx.fillStyle = "#10b981";
      ctx.font = "bold 76px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("∑", 90, 88);
      document.getElementById("apple-touch-icon").href = canvas.toDataURL("image/png");
    }

    window.addEventListener("DOMContentLoaded", () => {
      renderCards();
      createAppIcon();
      setInputs(readSaved());
      calculateAll();
      updateSaveStatus();
    });
  </script>
</body>
</html>
