<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Stat Calculator</title>

  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stat Calc">
  <link id="apple-touch-icon" rel="apple-touch-icon">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Safe-area insets for iPad notch/home bar */
    body {
      padding-top: env(safe-area-inset-top, 20px);
      padding-bottom: env(safe-area-inset-bottom, 20px);
      padding-left: env(safe-area-inset-left, 16px);
      padding-right: env(safe-area-inset-right, 16px);
      background-color: #121212;
    }
  </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center">

  <div class="w-full max-w-2xl px-4 py-6 flex flex-col gap-6">

    <!-- Header & Action Bar -->
    <header class="flex flex-col sm:flex-row items-center justify-between gap-4 border-b border-neutral-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-white">Stat Calculator</h1>
        <p id="save-status" class="text-xs text-neutral-400 mt-1">Status: Initialized</p>
      </div>

      <div class="flex items-center gap-3">
        <button id="revert-btn" onclick="revertToSaved()" class="px-3 py-2 text-xs font-semibold rounded-lg bg-neutral-800 text-neutral-300 hover:bg-neutral-700 transition">
          Revert
        </button>
        <button id="save-btn" onclick="saveInputs()" class="px-5 py-2 text-sm font-bold rounded-lg bg-emerald-600 text-white hover:bg-emerald-500 active:scale-95 transition shadow-lg shadow-emerald-950">
          Save Inputs
        </button>
      </div>
    </header>

    <!-- CARD 1: EAtk -->
    <section class="bg-neutral-900 border border-neutral-800 rounded-2xl p-5 shadow-md">
      <div class="flex items-center justify-between mb-4">
        <div>
          <span class="text-xs uppercase tracking-wider font-semibold text-emerald-400">Formula 1</span>
          <h2 class="text-lg font-bold text-white">EAtk</h2>
        </div>
        <span class="text-xs font-mono bg-neutral-800 px-2.5 py-1 rounded text-neutral-300">EAtk * (y%)</span>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-white mb-1.5">EAtk</label>
          <input 
            type="number" 
            step="any"
            id="eatk_x" 
            oninput="handleInputChange()"
            placeholder="e.g. 1000"
            class="w-full bg-white text-black font-semibold px-3 py-2.5 rounded-lg border-2 border-neutral-300 focus:outline-none focus:border-emerald-500"
          >
        </div>
        <div>
          <label class="block text-sm font-semibold text-white mb-1.5">Def %</label>
          <input 
            type="number" 
            step="any"
            id="eatk_y" 
            oninput="handleInputChange()"
            placeholder="e.g. 25"
            class="w-full bg-white text-black font-semibold px-3 py-2.5 rounded-lg border-2 border-neutral-300 focus:outline-none focus:border-emerald-500"
          >
        </div>
      </div>

      <div class="mt-4 pt-3 border-t border-neutral-800 flex items-baseline justify-between">
        <span class="text-sm font-medium text-neutral-400">Calculated EAtk:</span>
        <span id="eatk_result" class="text-2xl font-bold font-mono text-emerald-400">—</span>
      </div>
    </section>

    <!-- CARD 2: Def -->
    <section class="bg-neutral-900 border border-neutral-800 rounded-2xl p-5 shadow-md">
      <div class="flex items-center justify-between mb-4">
        <div>
          <span class="text-xs uppercase tracking-wider font-semibold text-blue-400">Formula 2</span>
          <h2 class="text-lg font-bold text-white">Def</h2>
        </div>
        <span class="text-xs font-mono bg-neutral-800 px-2.5 py-1 rounded text-neutral-300">x / ((100 - y)%)</span>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-white mb-1.5">Value (x)</label>
          <input 
            type="number" 
            step="any"
            id="def_x" 
            oninput="handleInputChange()"
            placeholder="e.g. 500"
            class="w-full bg-white text-black font-semibold px-3 py-2.5 rounded-lg border-2 border-neutral-300 focus:outline-none focus:border-blue-500"
          >
        </div>
        <div>
          <label class="block text-sm font-semibold text-white mb-1.5">Percent (y %)</label>
          <input 
            type="number" 
            step="any"
            id="def_y" 
            oninput="handleInputChange()"
            placeholder="e.g. 30"
            class="w-full bg-white text-black font-semibold px-3 py-2.5 rounded-lg border-2 border-neutral-300 focus:outline-none focus:border-blue-500"
          >
        </div>
      </div>

      <div class="mt-4 pt-3 border-t border-neutral-800 flex items-baseline justify-between">
        <span class="text-sm font-medium text-neutral-400">Calculated Def:</span>
        <span id="def_result" class="text-2xl font-bold font-mono text-blue-400">—</span>
      </div>
    </section>

    <!-- CARD 3: TDef -->
    <section class="bg-neutral-900 border border-neutral-800 rounded-2xl p-5 shadow-md">
      <div class="flex items-center justify-between mb-4">
        <div>
          <span class="text-xs uppercase tracking-wider font-semibold text-purple-400">Formula 3</span>
          <h2 class="text-lg font-bold text-white">TDef</h2>
        </div>
        <span class="text-xs font-mono bg-neutral-800 px-2.5 py-1 rounded text-neutral-300">floor(x / Def)</span>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-white mb-1.5">Value (x)</label>
          <input 
            type="number" 
            step="any"
            id="tdef_x" 
            oninput="handleInputChange()"
            placeholder="e.g. 1500"
            class="w-full bg-white text-black font-semibold px-3 py-2.5 rounded-lg border-2 border-neutral-300 focus:outline-none focus:border-purple-500"
          >
        </div>
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-sm font-semibold text-white">Def (y / Divisor)</label>
            <button type="button" onclick="copyDefToTDef()" class="text-xs text-purple-400 hover:text-purple-300 underline">
              Use Def from above
            </button>
          </div>
          <input 
            type="number" 
            step="any"
            id="tdef_def" 
            oninput="handleInputChange()"
            placeholder="e.g. 714.28"
            class="w-full bg-white text-black font-semibold px-3 py-2.5 rounded-lg border-2 border-neutral-300 focus:outline-none focus:border-purple-500"
          >
        </div>
      </div>

      <div class="mt-4 pt-3 border-t border-neutral-800 flex items-baseline justify-between">
        <div>
          <span class="text-sm font-medium text-neutral-400">Calculated TDef (Rounded Down):</span>
          <div id="tdef_raw" class="text-xs font-mono text-neutral-500 mt-0.5">Raw: —</div>
        </div>
        <span id="tdef_result" class="text-3xl font-black font-mono text-purple-400">—</span>
      </div>
    </section>

  </div>

  <script>
    const STORAGE_KEY = "pwa_stat_calculator_v2";

    // Fields list
    const fieldIds = ["eatk_x", "eatk_y", "def_x", "def_y", "tdef_x", "tdef_def"];

    let lastCalculatedDef = null;

    // Load inputs on startup
    window.addEventListener("DOMContentLoaded", () => {
      createAppIcon();
      loadSavedInputs();
      calculateAll();
    });

    function getInputs() {
      const data = {};
      fieldIds.forEach(id => {
        data[id] = document.getElementById(id).value;
      });
      return data;
    }

    function setInputs(data) {
      if (!data) return;
      fieldIds.forEach(id => {
        if (data[id] !== undefined) {
          document.getElementById(id).value = data[id];
        }
      });
    }

    function calculateAll() {
      // 1. EAtk = x * ((100 - y) / 100)
      const eatk_x = parseFloat(document.getElementById("eatk_x").value);
      const eatk_y = parseFloat(document.getElementById("eatk_y").value);
      const eatkOut = document.getElementById("eatk_result");

      if (!isNaN(eatk_x) && !isNaN(eatk_y)) {
        if (eatk_y === 0) {
          eatkOut.textContent = "Cannot div by 0";
          eatkOut.className = "text-lg font-bold font-mono text-rose-400";
        } else {
          const val = eatk_x * ((100 - eatk_y) / 100);
          eatkOut.textContent = formatNumber(val);
          eatkOut.className = "text-2xl font-bold font-mono text-emerald-400";
        }
      } else {
        eatkOut.textContent = "—";
        eatkOut.className = "text-2xl font-bold font-mono text-neutral-600";
      }

      // 2. Def = x / ((100 - y) / 100)
      const def_x = parseFloat(document.getElementById("def_x").value);
      const def_y = parseFloat(document.getElementById("def_y").value);
      const defOut = document.getElementById("def_result");

      if (!isNaN(def_x) && !isNaN(def_y)) {
        const denom = (100 - def_y) / 100;
        if (denom === 0) {
          defOut.textContent = "Cannot div by 0";
          defOut.className = "text-lg font-bold font-mono text-rose-400";
          lastCalculatedDef = null;
        } else {
          const val = def_x / denom;
          lastCalculatedDef = val;
          defOut.textContent = formatNumber(val);
          defOut.className = "text-2xl font-bold font-mono text-blue-400";
        }
      } else {
        defOut.textContent = "—";
        defOut.className = "text-2xl font-bold font-mono text-neutral-600";
        lastCalculatedDef = null;
      }

      // 3. TDef = floor(x / def)
      const tdef_x = parseFloat(document.getElementById("tdef_x").value);
      const tdef_def = parseFloat(document.getElementById("tdef_def").value);
      const tdefOut = document.getElementById("tdef_result");
      const tdefRaw = document.getElementById("tdef_raw");

      if (!isNaN(tdef_x) && !isNaN(tdef_def)) {
        if (tdef_def === 0) {
          tdefOut.textContent = "Cannot div by 0";
          tdefOut.className = "text-lg font-bold font-mono text-rose-400";
          tdefRaw.textContent = "Raw: —";
        } else {
          const raw = tdef_x / tdef_def;
          const rounded = Math.floor(raw);
          tdefOut.textContent = rounded.toLocaleString();
          tdefOut.className = "text-3xl font-black font-mono text-purple-400";
          tdefRaw.textContent = `Raw: ${formatNumber(raw)}`;
        }
      } else {
        tdefOut.textContent = "—";
        tdefOut.className = "text-3xl font-black font-mono text-neutral-600";
        tdefRaw.textContent = "Raw: —";
      }
    }

    function handleInputChange() {
      calculateAll();
      updateSaveStatus();
    }

    // Copy the computed Def value into the TDef input field
    function copyDefToTDef() {
      if (lastCalculatedDef !== null && !isNaN(lastCalculatedDef)) {
        document.getElementById("tdef_def").value = parseFloat(lastCalculatedDef.toFixed(4));
        handleInputChange();
      }
    }

    // Save strictly on button press
    function saveInputs() {
      const current = getInputs();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(current));
      updateSaveStatus();

      const btn = document.getElementById("save-btn");
      const originalText = btn.textContent;
      btn.textContent = "Saved ✓";
      btn.classList.replace("bg-emerald-600", "bg-emerald-500");
      setTimeout(() => {
        btn.textContent = originalText;
        btn.classList.replace("bg-emerald-500", "bg-emerald-600");
      }, 1200);
    }

    function loadSavedInputs() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try {
          const data = JSON.parse(raw);
          setInputs(data);
        } catch (e) {
          console.error("Failed to parse saved state", e);
        }
      }
      updateSaveStatus();
    }

    function revertToSaved() {
      loadSavedInputs();
      calculateAll();
    }

    function updateSaveStatus() {
      const current = JSON.stringify(getInputs());
      const saved = localStorage.getItem(STORAGE_KEY) || JSON.stringify({});
      const statusEl = document.getElementById("save-status");

      if (current === saved) {
        statusEl.textContent = "All changes saved";
        statusEl.className = "text-xs text-emerald-400 mt-1";
      } else {
        statusEl.textContent = "Unsaved changes (tap 'Save Inputs' to persist)";
        statusEl.className = "text-xs text-amber-400 mt-1";
      }
    }

    function formatNumber(num) {
      if (!isFinite(num)) return "—";
      return num.toLocaleString(undefined, {
        minimumFractionDigits: 0,
        maximumFractionDigits: 4
      });
    }

    // Dynamic app icon for iPad Home Screen
    function createAppIcon() {
      const canvas = document.createElement("canvas");
      canvas.width = 180;
      canvas.height = 180;
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "#121212";
      ctx.fillRect(0, 0, 180, 180);

      ctx.fillStyle = "#10b981";
      ctx.font = "bold 76px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("∑", 90, 88);

      const link = document.getElementById("apple-touch-icon");
      if (link) link.href = canvas.toDataURL("image/png");
    }
  </script>
</body>
</html>
